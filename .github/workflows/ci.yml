name: CI

on:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

  workflow_dispatch:

jobs:
  build:
    # pnpm 11 requires Node.js >= 22.13, so the dev legs run on LTS Node.js 22,
    # 24 and 26. Neither the core `inspector-metrics` package (node-cint64 was
    # replaced by a pure-JS BigInt implementation) nor `inspector-vm`
    # (@sematext/gc-stats was replaced by the built-in perf_hooks GC observer)
    # carries a mandatory native dependency anymore — only native-hdr-histogram
    # remains as a native module (NAPI prebuilds), which builds/resolves on all
    # three runtimes. Older *published* runtimes are covered by the compat job below.
    strategy:
      matrix:
        node-version: [22, 24, 26]
        os:
          - ubuntu-24.04
          - ubuntu-22.04

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Cache node modules
        uses: actions/cache@v6
        env:
          cache-name: cache-node-modules
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-${{ runner.node-version }}-build-${{ env.cache-name }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.node-version }}-build-${{ env.cache-name }}-

      - uses: pnpm/action-setup@v6

      - name: build
        run: pnpm run build

      - name: test
        run: pnpm run test
        env:
          CI: true
          TZ: Europe/Berlin

      # the build output only depends on the fixed tsc target (es2017), not on
      # the building host; publish the artifact from a single leg
      - name: Upload built packages
        if: matrix.node-version == 22 && matrix.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@v7
        with:
          name: compatibility-packages
          path: |
            packages/inspector-metrics/build
            packages/inspector-metrics/package.json
            packages/inspector-prometheus/build
            packages/inspector-prometheus/package.json

  # Compatibility check: the published packages must keep working on the
  # supported Node.js runtimes (the core's engines say node >= 14) even though
  # the project is developed on modern Node.js with pnpm 11. It takes the built
  # workspace artifacts and re-installs + smoke-tests them with plain npm on
  # Node.js 14-20 (native modules rebuild for the target runtime), so a
  # dependency that drops old-Node support fails CI before release.
  compat:
    runs-on: ubuntu-22.04
    needs: build
    strategy:
      fail-fast: false
      matrix:
        node-version: [14, 16, 18, 20]
    name: compat-node-${{ matrix.node-version }}

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Download built packages
        uses: actions/download-artifact@v8
        with:
          name: compatibility-packages
          path: .compat/pkg

      # upload-artifact@v4+ strips the common root (packages/) of a multi-path
      # upload, so the download lands as .compat/pkg/<name>/... while the smoke
      # script expects .compat/pkg/packages/<name>/... . Re-add the nesting once.
      - name: Restore packages/ layout for the smoke script
        run: |
          mkdir -p .compat/pkg/packages
          mv .compat/pkg/inspector-metrics .compat/pkg/packages/
          mv .compat/pkg/inspector-prometheus .compat/pkg/packages/

      - name: Smoke test on legacy Node.js
        env:
          COMPAT_PKG_DIR: ${{ github.workspace }}/.compat/pkg
        run: bash test-env/compat-smoke.sh
