packages:
  - examples/**
  - packages/**

# pnpm 11: dependencies allowed to run their install scripts (native modules).
# Replaces the pnpm-10 `onlyBuiltDependencies` setting, which pnpm 11 no
# longer reads from package.json.
allowBuilds:
  node-cint64: true
  native-hdr-histogram: true
  "@sematext/gc-stats": true

minimumReleaseAgeExclude:
  - '@biomejs/biome@2.5.10'
  - '@biomejs/cli-darwin-arm64@2.5.10'
  - '@biomejs/cli-darwin-x64@2.5.10'
  - '@biomejs/cli-linux-arm64-musl@2.5.10'
  - '@biomejs/cli-linux-arm64@2.5.10'
  - '@biomejs/cli-linux-x64-musl@2.5.10'
  - '@biomejs/cli-linux-x64@2.5.10'
  - '@biomejs/cli-win32-arm64@2.5.10'
  - '@biomejs/cli-win32-x64@2.5.10'
